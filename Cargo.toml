[package]
name = "periscope"
version = "0.1.0"
edition = "2024"
description = "MCP server that brokers into a Neovim instance running the user's own config, exposing its LSP clients, formatter/linter registries, DAP setup, and more as MCP tools."
license = "Apache-2.0"

[dependencies]
rmpv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
